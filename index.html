<!DOCTYPE html>
<html>
<head>
    <title>WSMA Dashboard</title>

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
        }

        .box {
            background: #1e293b;
            padding: 20px;
            margin: 20px auto;
            width: 70%;
            border-radius: 10px;
        }

        input {
            width: 80%;
            padding: 10px;
            border-radius: 8px;
            border: none;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            cursor: pointer;
        }

        .actions button {
            margin: 5px;
            background: #3b82f6;
        }

        .output {
            background: black;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
        }
    </style>
</head>

<body>

<h1>🚀 WSMA Network Automation Dashboard</h1>

<div class="box">
    <input id="command" placeholder="Enter command (show ip interface brief)">
    <br>
    <button onclick="runCommand()">Run Command</button>
</div>

<div class="actions">
    <button onclick="quick('show ip interface brief')">Interfaces</button>
    <button onclick="quick('show vlan brief')">VLANs</button>
    <button onclick="quick('show running-config')">Running Config</button>
</div>

<div class="box output" id="output">
    Output will appear here...
</div>

<script>
function runCommand() {
    let cmd = document.getElementById("command").value;

    fetch("/run?cmd=" + cmd)
    .then(res => res.text())
    .then(data => {
        document.getElementById("output").innerText = data;
    });
}

function quick(cmd) {
    document.getElementById("command").value = cmd;
    runCommand();
}
</script>

</body>
</html>
